  <!--
    Printed QR codes point here. Forward straight into the Free AI Audit, keeping attribution:
    the original query string is carried through, the event UTM defaults are added where missing
    (same values /connect always stored: utm_source=highlevel, utm_medium=qr, utm_campaign=highlevel_event_2026),
    and via=connect tells audit.js to apply the full event attribution (source/event/qr_source).
    Keep DEFAULTS in sync with eventDefaults in /assets/funnel/config.js.
  -->
  <script>
    (function () {
      var FALLBACK = "/audit/?utm_source=highlevel&utm_medium=qr&utm_campaign=highlevel_event_2026&via=connect";
      var next = FALLBACK;
      try {
        var DEFAULTS = { utm_source: "highlevel", utm_medium: "qr", utm_campaign: "highlevel_event_2026" };
        var p = new URLSearchParams(location.search);
        for (var k in DEFAULTS) if (!p.get(k)) p.set(k, DEFAULTS[k]);
        p.set("via", "connect");
        next = "/audit/?" + p.toString() + location.hash;
        try { sessionStorage.setItem("aat_connect_ref", (document.referrer || "").slice(0, 400)); } catch (e) {}
      } catch (e) { next = FALLBACK; }
      window.__AAT_NEXT__ = next;
      location.replace(next);
    })();
  </script>
